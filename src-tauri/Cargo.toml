[package]
name = "nihongo-mate"
version = "1.0.0"
description = "Korean-friendly Japanese learning app"
authors = ["Nihongo Mate"]
edition = "2021"

[lib]
name = "nihongo_mate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
