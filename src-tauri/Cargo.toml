[package]
name = "yuseons-nihongo"
version = "2.0.1"
description = "Korean-friendly Japanese learning app"
authors = ["Yuseon"]
edition = "2021"

[lib]
name = "nihongo_mate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
